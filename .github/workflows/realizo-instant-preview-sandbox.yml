name: Realizo - fast preview, original 720p, no black waiting
on:
  push:
    branches: [feature/realizo-instant-template-preview]
    paths: ['.github/workflows/realizo-instant-preview-sandbox.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: realizo-instant-preview-sandbox
  cancel-in-progress: false
jobs:
  verify-and-deploy:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/realizo-instant-template-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      REALIZO_ENV: sandbox
      REALIZO_AUTH_PROVIDER: native
      PAYPAL_MODE: sandbox
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Confirm Sandbox target and preview assets
        run: |
          node scripts/check-realizo-auth-sandbox.mjs
          npm run wallet:preflight:sandbox
          test -s public/assets/realizo/templates/ugc-preview-stream-30s.mp4
          test -s public/assets/realizo/templates/ugc-hover-5s.mp4
          test -s public/assets/realizo/templates/ugc-master-30s.jpg
          test ! -e public/assets/realizo/templates/ugc-preview-native-30s.mp4
          test ! -e public/assets/realizo/templates/ugc-master-30s.mp4
      - name: Confirm original 720p, fast start, compact hover, and poster player
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('public/assets/realizo/templates')
          media=[base/'ugc-preview-stream-30s.mp4',base/'ugc-hover-5s.mp4']
          for p in media:
              b=p.read_bytes()
              assert b.find(b'moov') < b.find(b'mdat'), p
              assert b'ftyp' in b[:128]
          assert 1_000_000 < media[0].stat().st_size < 12_000_000
          assert 50_000 < media[1].stat().st_size < 2_500_000
          code=Path('components/RealizoTemplateLibrary.jsx').read_text()
          assert 'realizo-template-loading-poster' in code
          assert 'TEMPLATE_HOVER_SRC' in code
          assert 'setFullStarted(true)' in code
          print('PASS: streamable MP4 with poster, nonblocking hover and correct playback states')
          PY
      - name: Test template and wallet/download boundaries without paid generation
        run: |
          node --test tests/realizo-template-independent-flow.test.mjs \
            tests/realizo-video-download-boundary.test.mjs \
            tests/realizo-muapi-master-ugc30.test.mjs
      - name: Build isolated Cloudflare app
        run: npm run cloudflare:build:realizo-auth-sandbox
      - name: Wallet and studio regressions
        run: |
          npm run test:wallet
          node --test tests/realizo-ad-templates-v11.test.mjs \
            tests/realizo-premium-studio.test.mjs
          test -s .open-next/worker.js
      - name: Deploy only realizo-auth-sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/check-realizo-auth-sandbox.mjs
          npx --no-install opennextjs-cloudflare deploy --config wrangler.auth-sandbox.jsonc
      - name: Smoke check actual asset availability, no wallet or Muapi charges
        run: |
          node --input-type=module <<'JS'
          const base='https://realizo-auth-sandbox.abelarriaga0.workers.dev';
          for(const file of ['ugc-preview-stream-30s.mp4','ugc-hover-5s.mp4']){
            const r=await fetch(base+'/assets/realizo/templates/'+file,{
              method:'HEAD',signal:AbortSignal.timeout(25000)});
            if(!r.ok||!/video\/mp4/.test(r.headers.get('content-type')||''))throw Error(file+' unavailable: '+r.status);
          }
          const wallet=await fetch(base+'/api/wallet',{signal:AbortSignal.timeout(25000)});
          if(wallet.status!==401)throw Error('Wallet no longer private');
          console.log('PASS: progressive full and hover media online; private wallet; zero paid generations.');
          JS

# Regression test newline syntax corrected; rerun deployment.
