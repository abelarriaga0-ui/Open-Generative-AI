name: Realizo Sandbox - wallet credit audit (read only)

on:
  push:
    branches:
      - feature/wallet-compartida-muapi
    paths:
      - .github/workflows/realizo-sandbox-credit-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realizo-sandbox-readonly-credit-audit
  cancel-in-progress: false

jobs:
  audit-d1:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/wallet-compartida-muapi'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact sandbox DB and safe flags before access
        run: node scripts/check-sandbox-isolation.mjs
      - name: Install Wrangler for READ ONLY verification
        run: |
          npm install --prefix "$RUNNER_TEMP/wrangler" --no-save --no-audit --no-fund wrangler@4.151.3
          echo "$RUNNER_TEMP/wrangler/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Count sandbox wallets without exporting identities or changing balances
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          wrangler d1 execute WALLETS_DB --config wrangler.sandbox.jsonc --remote --json \
            --command "SELECT (SELECT COUNT(*) FROM wallet_users) AS user_count, (SELECT COUNT(*) FROM wallets) AS wallet_count, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='legacy_muapi_credit_imports') AS legacy_table_exists;" \
            > "$RUNNER_TEMP/realizo-audit.json"
          AUDIT_JSON="$RUNNER_TEMP/realizo-audit.json" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync(process.env.AUDIT_JSON, 'utf8'));
          const entries = Array.isArray(data) ? data : [data];
          const first = entries.flatMap(e => e.results || e.result?.results || []).at(0);
          if (!first || !Number.isInteger(first.user_count) || !Number.isInteger(first.wallet_count))
            throw new Error('Unexpected D1 count-only response');
          console.log('Sandbox D1 read-only audit completed.');
          console.log('Verified user records: ' + first.user_count);
          console.log('Wallet records: ' + first.wallet_count);
          console.log('Historical credit migration installed: ' + Boolean(first.legacy_table_exists));
          console.log('No email addresses, user IDs, secrets or provider keys were printed.');
          console.log('No wallet was credited or charged.');
          NODE
