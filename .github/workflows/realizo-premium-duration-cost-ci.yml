name: Realizo Premium model/duration and cost — validation only
on:
  pull_request:
    branches: [feature/realizo-cloudflare-auth-videos]
    paths:
      - 'lib/realizo-creative/**'
      - 'components/RealizoPremium.jsx'
      - 'packages/studio/src/components/VideoStudio.jsx'
      - 'app/api/realizo/ai-premium/**'
      - 'migrations/0018_realizo_premium_video_choice_cost_audit.sql'
      - 'migrations/0020_realizo_paid_research_without_daily_cap.sql'
      - 'tests/test_realizo_paid_without_daily_limit.py'
      - 'tests/realizo-*.test.mjs'
      - '.github/workflows/realizo-premium-duration-cost-ci.yml'
permissions:
  contents: read
jobs:
  test-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate premium plan, price accounting and existing behavior
        run: |
          node --test tests/realizo-v8-seller-copy.test.mjs tests/realizo-v7-copy-duration.test.mjs tests/realizo-cinematic-hook-editing.test.mjs tests/realizo-nmf-sales-storyboard.test.mjs tests/realizo-local-subtitles.test.mjs tests/realizo-product-geometry.test.mjs tests/realizo-premium-recovery.test.mjs tests/realizo-grounded-research-formats.test.mjs tests/realizo-ugc-review-conversion.test.mjs tests/realizo-premium-hierarchical-picker.test.mjs tests/realizo-premium-duration-cost.test.mjs tests/realizo-ai-premium.test.mjs tests/realizo-premium-paid-languages.test.mjs tests/realizo-sales-director.test.mjs
      - name: Check paid research has no artificial daily cap, wallet still protected
        run: python3 -m unittest discover -s tests -p 'test_realizo_paid_without_daily_limit.py' -v
      - name: Install dependencies for JSX validation, no secrets
        run: npm install --no-save --package-lock=false --ignore-scripts
      - name: Check JSX syntax, no deployment
        run: |
          ./node_modules/.bin/babel components/RealizoPremium.jsx --out-file /tmp/realizo-premium.jsx.js --presets @babel/preset-react
          ./node_modules/.bin/babel packages/studio/src/components/VideoStudio.jsx --out-file /tmp/realizo-video.jsx.js --presets @babel/preset-react
