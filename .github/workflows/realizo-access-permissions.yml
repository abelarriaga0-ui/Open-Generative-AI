name: Realizo - verify Access permissions
on:
  push:
    branches: [feature/wallet-compartida-muapi]
    paths: ['.github/workflows/realizo-access-permissions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check limited Cloudflare Access API permissions
        env:
          ACCESS_TOKEN: ${{ secrets.CLOUDFLARE_ACCESS_API_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          const token=process.env.ACCESS_TOKEN;
          if(!token) throw new Error('No se encontró el token de Access');
          const base='https://api.cloudflare.com/client/v4/accounts/7e405c54c1a91abbdad537f7fec379a1/access';
          for (const endpoint of ['/apps?per_page=100','/identity_providers?per_page=100']) {
            const response=await fetch(base+endpoint, {headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
            console.log(endpoint.startsWith('/apps')?'APPLICATIONS_HTTP='+response.status:'IDENTITY_PROVIDERS_HTTP='+response.status);
            if(response.status!==200) process.exitCode=1;
          }
          JS
