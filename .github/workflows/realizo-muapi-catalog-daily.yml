name: Realizo - refresh Muapi video catalog every day
on:
  schedule:
    # Once per day, 09:17 UTC (04:17 Ecuador); never on client page loads.
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: realizo-muapi-catalog-daily
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install existing Wrangler dependencies
        run: npm ci --no-audit --no-fund
      - name: Read public Muapi schemas and validate a safe snapshot
        run: node scripts/refresh-realizo-muapi-catalog.mjs .realizo-muapi-video-catalog.sql
      - name: Store snapshot in existing D1 without touching wallets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: |
          set -euo pipefail
          npx wrangler d1 execute WALLETS_DB --config wrangler.consolidated.jsonc --remote --file=.realizo-muapi-video-catalog.sql
      - name: Confirm D1 catalog record exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: |
          npx wrangler d1 execute WALLETS_DB --config wrangler.consolidated.jsonc --remote --command "SELECT id, updated_at, length(snapshot_json) AS bytes FROM realizo_muapi_video_catalog WHERE id='active';"
