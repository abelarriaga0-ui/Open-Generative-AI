name: Realizo - securely connect Muapi one-generation pilot
on:
  push:
    branches: [feature/realizo-cloudflare-auth-videos]
    paths: ['.github/workflows/realizo-muapi-activate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configure:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/realizo-cloudflare-auth-videos'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      MUAPI_API_KEY: ${{ secrets.REALIZO_MUAPI_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
      REALIZO_D1_SANDBOX: '2561f6c8-bfb2-4ea4-8527-7fec29188edf'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated pilot source before any mutation
        run: |
          node scripts/check-realizo-auth-sandbox.mjs
          node --test tests/realizo-muapi-pilot.test.mjs
      - name: Check required provider secret and exactly one verified Realizo pilot account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$MUAPI_API_KEY" ]; then
            echo "REALIZO_MUAPI_API_KEY_PRESENT=false"
            echo "Provider configuration remains disabled. No network generation request made."
            exit 0
          fi
          echo "REALIZO_MUAPI_API_KEY_PRESENT=true"
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const api=process.env.CLOUDFLARE_API_TOKEN;
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/'+process.env.REALIZO_D1_SANDBOX+'/query';
          const r=await fetch(base,{
            method:'POST',headers:{Authorization:'Bearer '+api,'Content-Type':'application/json'},
            body:JSON.stringify({sql:"SELECT id FROM wallet_users WHERE auth_provider='realizo' ORDER BY id LIMIT 2"}),
          });
          if(!r.ok)throw Error('Unable to read isolated Sandbox accounts');
          const json=await r.json();
          const rows=json.result?.[0]?.results||[];
          console.log('ELIGIBLE_REALIZO_ACCOUNTS='+rows.length);
          if(!json.success || rows.length!==1)throw Error('One and only one verified Realizo account is required for live-provider credit pilot');
          if(!/^[0-9a-f-]{36}$/i.test(rows[0].id))throw Error('Unexpected account identifier');
          writeFileSync(process.env.RUNNER_TEMP+'/realizo-pilot-id',rows[0].id,{mode:0o600});
          JS
      - name: Validate real Muapi key without buying generations
        if: env.MUAPI_API_KEY != ''
        run: |
          node --input-type=module <<'JS'
          const response=await fetch('https://api.muapi.ai/api/v1/account/balance',{
            headers:{'x-api-key':process.env.MUAPI_API_KEY},signal:AbortSignal.timeout(20000),
          });
          if(!response.ok)throw Error('Muapi key could not be verified (HTTP '+response.status+')');
          console.log('MUAPI_CREDENTIAL_AUTHENTICATED=true; no balance/secret contents logged.');
          JS
      - name: Install shared Muapi key and single pilot owner ONLY in isolated Sandbox Worker
        if: env.MUAPI_API_KEY != ''
        env:
          P: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/realizo-wrangler" --no-save --no-audit --no-fund wrangler@4.151.3 >/dev/null
          printf '%s' "$MUAPI_API_KEY" |
            "$RUNNER_TEMP/realizo-wrangler/node_modules/.bin/wrangler" secret put MUAPI_API_KEY --name realizo-auth-sandbox --config wrangler.auth-sandbox.jsonc
          cat "$RUNNER_TEMP/realizo-pilot-id" |
            "$RUNNER_TEMP/realizo-wrangler/node_modules/.bin/wrangler" secret put REALIZO_MUAPI_PILOT_ACCOUNT_ID --name realizo-auth-sandbox --config wrangler.auth-sandbox.jsonc
          rm -f "$RUNNER_TEMP/realizo-pilot-id"
          echo 'Shared Muapi key and a single allowed verified owner installed without logging values.'
      - name: Activate only verified low-cost Wan 2.2 5-second model in Sandbox D1
        if: env.MUAPI_API_KEY != ''
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/'+process.env.REALIZO_D1_SANDBOX+'/query';
          const sql="UPDATE model_prices SET enabled=1,updated_at=datetime('now') WHERE model_id='wan2.2-image-to-video' AND muapi_endpoint='wan2.2-image-to-video' AND customer_price_cents=35 AND allowed_input_keys_json='[\"prompt\",\"image_url\",\"aspect_ratio\"]' AND fixed_options_json='{\"duration\":5,\"resolution\":\"480p\",\"quality\":\"medium\"}'";
          const response=await fetch(base,{method:'POST',headers:{
            Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'
          },body:JSON.stringify({sql})});
          if(!response.ok)throw Error('Unable to enable isolated fixed-price pilot model');
          const json=await response.json();
          if(!json.success||json.result?.[0]?.meta?.changes!==1)throw Error('Pilot price missing/mismatch/already enabled; manual review required');
          console.log('PILOT_MODEL_ENABLED=true; ceiling one provider call total; PayPal Sandbox unchanged.');
          JS
      - name: Confirm anonymous wallet stays inaccessible
        if: env.MUAPI_API_KEY != ''
        run: |
          node --input-type=module <<'JS'
          const base='https://realizo-auth-sandbox.abelarriaga0.workers.dev';
          const r=await fetch(base+'/api/wallet',{redirect:'manual',signal:AbortSignal.timeout(15000)});
          if(r.status!==401)throw Error('Anonymous wallet unexpectedly exposed');
          console.log('PASS: anonymous cannot read sandbox wallet; no provider generation was submitted.');
          JS
