name: Realizo Premium 30s - safe approval diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/realizo-premium-approval-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Reproduce selected 30-second approval with D1 read access only
        run: |
          node --check scripts/diagnose-premium-approval-read-only.mjs
          node scripts/diagnose-premium-approval-read-only.mjs
