name: Realizo Images - genuine Muapi endpoint validation
on:
  push:
    branches: [main]
    paths: [".github/workflows/realizo-image-provider-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provider:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      REALIZO_MUAPI_API_KEY: ${{ secrets.REALIZO_MUAPI_API_KEY }}
    steps:
      - name: Validar generación 4K real con precio Muapi (una sola solicitud)
        run: |
          node --input-type=module <<'JS'
          const key=process.env.REALIZO_MUAPI_API_KEY;
          if(!key)throw Error('No hay clave Muapi para verificar el endpoint.');
          const url='https://api.muapi.ai/api/v1/nano-banana-2-1-edit';
          const body={
            prompt:'Create a new polished vertical ecommerce product photograph based on the supplied product image. Preserve product identity and brand label. Photorealistic 4:5 composition, studio lighting, strong focal product, elegant warm background, no fake claims.',
            images_list:['https://realizo-auth-sandbox.abelarriaga0.workers.dev/templates/explosion-premium-azul.webp'],
            aspect_ratio:'4:5',resolution:'4k',output_format:'png',google_search:true
          };
          const start=await fetch(url,{
            method:'POST',headers:{'x-api-key':key,'Content-Type':'application/json'},
            body:JSON.stringify(body),signal:AbortSignal.timeout(40000)
          });
          const submission=await start.json().catch(()=>({}));
          console.log('IMAGE_SUBMIT_HTTP='+start.status);
          if(!start.ok||typeof submission.request_id!=='string')throw Error('Nano Banana 2.1 submission failed');
          const id=submission.request_id;
          console.log('IMAGE_TASK_ACCEPTED=true');
          for(let i=0;i<90;i++){
            await new Promise(resolve=>setTimeout(resolve,2500));
            const response=await fetch('https://api.muapi.ai/api/v1/predictions/'+
              encodeURIComponent(id)+'/result',{headers:{'x-api-key':key},signal:AbortSignal.timeout(15000)});
            const result=await response.json().catch(()=>({}));
            const status=String(result.status||result.detail?.status||'').toLowerCase();
            if(['completed','success','succeeded'].includes(status)){
              console.log('IMAGE_4K_PROVIDER_COMPLETED=true');
              console.log('OUTPUT_PRESENT='+Boolean(result.outputs?.length||result.output||result.url));
              if(!result.outputs?.length&&!result.output&&!result.url)throw Error('Output URL missing');
              process.exit(0);
            }
            if(['failed','cancelled','canceled'].includes(status))throw Error('Provider image generation failed');
          }
          throw Error('Provider test did not complete before its deadline');
          JS
