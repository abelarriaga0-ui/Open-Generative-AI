name: Realizo - progressive previews without quality downscale
on:
  push:
    branches: [feature/realizo-instant-template-preview]
    paths: ['.github/workflows/realizo-progressive-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  encode-streamable-previews:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/realizo-instant-template-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Encode full-length native-resolution MP4 for progressive start and tiny hover preview
        shell: bash
        run: |
          set -euo pipefail
          IN=public/assets/realizo/templates/ugc-preview-native-30s.mp4
          DIR=public/assets/realizo/templates
          test -s "$IN"
          SOURCE_SIZE=$(stat -c%s "$IN")
          ffmpeg -hide_banner -loglevel error -y -i "$IN" \
            -c:v libx264 -preset medium -crf 20 -g 48 -keyint_min 48 -sc_threshold 0 \
            -pix_fmt yuv420p -c:a aac -b:a 96k -movflags +faststart \
            "$DIR/ugc-preview-stream-30s.mp4"
          ffmpeg -hide_banner -loglevel error -y -i "$IN" -t 5 \
            -c:v libx264 -preset medium -crf 22 -g 40 -keyint_min 40 -sc_threshold 0 \
            -pix_fmt yuv420p -an -movflags +faststart \
            "$DIR/ugc-hover-5s.mp4"
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$IN"
          for V in "$DIR/ugc-preview-stream-30s.mp4" "$DIR/ugc-hover-5s.mp4"; do
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$V" | grep -x '720x1280'
            ls -lh "$V"
          done
          python3 - <<'PY'
          import os, subprocess
          base='public/assets/realizo/templates/'
          a=base+'ugc-preview-stream-30s.mp4'
          b=base+'ugc-hover-5s.mp4'
          def seconds(file):
              return float(subprocess.check_output(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nokey=1:noprint_wrappers=1',file]).decode())
          assert abs(seconds(a)-30.08)<.2
          assert 4.85<seconds(b)<5.15
          assert 1_000_000<os.stat(a).st_size<12_000_000
          assert 50_000<os.stat(b).st_size<2_500_000
          print('PASS: full preview 720x1280, 30.08s; hover 720x1280, 5s; both streamable MP4')
          PY
          # MP4 atoms must have moov before mdat for progressive browser playback.
          python3 - <<'PY'
          from pathlib import Path
          for n in ('ugc-preview-stream-30s.mp4','ugc-hover-5s.mp4'):
            b=(Path('public/assets/realizo/templates')/n).read_bytes()
            assert b.find(b'moov')<b.find(b'mdat'), n
          PY
      - name: Commit optimized media without publishing master source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/realizo/templates/ugc-preview-stream-30s.mp4 public/assets/realizo/templates/ugc-hover-5s.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'assets(realizo): fast-start native 720p full and lightweight 5s hover previews'
          git fetch origin feature/realizo-instant-template-preview
          git rebase FETCH_HEAD
          git push origin HEAD:feature/realizo-instant-template-preview
