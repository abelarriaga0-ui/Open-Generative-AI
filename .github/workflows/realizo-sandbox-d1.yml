name: Realizo Sandbox - isolated D1 setup

on:
  # This only auto-runs when the sandbox setup workflow itself is introduced/changed.
  # It NEVER runs from main or production deploys.
  push:
    branches:
      - feature/wallet-compartida-muapi
    paths:
      - .github/workflows/realizo-sandbox-d1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: realizo-isolated-sandbox-d1
  cancel-in-progress: false

jobs:
  provision-wallet-d1:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/wallet-compartida-muapi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout development branch only
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify wallet code and SQL locally (no secrets)
        run: npm run test:wallet

      - name: Install standalone Wrangler (no app build or production deploy)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/realizo-wrangler" --no-save --no-audit --no-fund wrangler@4.151.3
          echo "$RUNNER_TEMP/realizo-wrangler/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Create or verify isolated Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Account ID is an account locator (not a secret) from the authorized Cloudflare account.
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: node scripts/provision-sandbox-d1.mjs

      - name: Stop unless D1 is isolated and payments/generation remain in Sandbox
        run: npm run wallet:preflight:sandbox

      - name: Save only the newly created sandbox database ID to the feature branch
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- wrangler.sandbox.jsonc; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- wrangler.sandbox.jsonc
            git commit -m 'chore(wallet): record isolated sandbox D1 UUID'
            git push origin HEAD:feature/wallet-compartida-muapi
          fi

      - name: Apply 0001 wallet and 0002 PayPal SQL ONLY to remote Sandbox D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: npm run wallet:migrate:sandbox

      - name: Read-only schema verification on Sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: npm run wallet:check:sandbox

      - name: Report safe completion
        run: |
          echo 'Realizo Sandbox D1 migrada. No se ha desplegado Worker ni conectado PayPal real.'
