name: Realizo - inspect Muapi readiness safely
on:
  push:
    branches: [feature/realizo-cloudflare-auth-videos]
    paths: ['.github/workflows/realizo-muapi-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/realizo-cloudflare-auth-videos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GITHUB_MUAPI_KEY: ${{ secrets.MUAPI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check secret presence without reading secret values
        shell: bash
        run: |
          set -euo pipefail
          node -e "console.log('GITHUB_MUAPI_API_KEY_PRESENT='+Boolean(process.env.GITHUB_MUAPI_KEY))"
          npm install --prefix "$RUNNER_TEMP/realizo-wrangler" --no-save --no-audit --no-fund wrangler@4.151.3 >/dev/null
          for worker in realizo-auth-sandbox realizo-sandbox open-generative-ai; do
            if "$RUNNER_TEMP/realizo-wrangler/node_modules/.bin/wrangler" secret list --name "$worker" > "$RUNNER_TEMP/realizo-worker-secrets.json" 2>/dev/null; then
              WORKER_NAME="$worker" node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/realizo-worker-secrets.json','utf8'));
          const names=new Set(data.map(x=>x.name));
          const name=process.env.WORKER_NAME;
          console.log('WORKER_'+name+'_MUAPI_API_KEY_PRESENT='+names.has('MUAPI_API_KEY'));
          JS
            else
              echo "WORKER_${worker}_SECRET_LIST_UNAVAILABLE=true"
            fi
          done
      - name: Count eligible verified Realizo accounts without exposing identity
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+
            '/d1/database/2561f6c8-bfb2-4ea4-8527-7fec29188edf/query';
          const res=await fetch(base,{method:'POST',headers:{
            Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
            'Content-Type':'application/json'
          },body:JSON.stringify({sql:"SELECT COUNT(*) AS n FROM wallet_users WHERE auth_provider='realizo'"})});
          if(!res.ok){console.log('REALIZO_ACCOUNT_COUNT_LOOKUP_AVAILABLE=false');process.exit(0)}
          const json=await res.json();
          console.log('REALIZO_ACCOUNT_COUNT_LOOKUP_AVAILABLE='+Boolean(json.success));
          if(json.success)console.log('REALIZO_NATIVE_ACCOUNT_COUNT='+Number(json.result?.[0]?.results?.[0]?.n??-1));
          JS
