name: Realizo Hiperrealista PRO - probar MP4 por fragmentos D1 sin clientes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/realizo-hyperreal-pro-storage-check.yml'
      - 'scripts/hyperreal-pro-storage-probe.mjs'
      - 'scripts/hyperreal-pro-video-roundtrip.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install and verify server-side FFmpeg renderer
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
      - name: Test bounded D1 chunk storage using a disposable dedicated probe table
        run: node scripts/hyperreal-pro-storage-probe.mjs
      - name: Verify a real synthetic MP4 survives multiple DB chunks and SHA-256 reconstruction
        run: node scripts/hyperreal-pro-video-roundtrip.mjs
