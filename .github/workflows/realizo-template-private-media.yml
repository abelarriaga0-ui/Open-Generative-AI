name: Realizo - private template media setup (Sandbox only)
on:
  push:
    branches: [feature/realizo-controlled-video-downloads]
    paths: ['.github/workflows/realizo-template-private-media.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-archive:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/realizo-controlled-video-downloads'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned Wrangler and validate source media
        run: |
          set -euo pipefail
          test -s public/assets/realizo/templates/ugc-master-30s.mp4
          npm install --prefix "$RUNNER_TEMP/realizo-wrangler" --no-save --no-audit --no-fund wrangler@4.151.3 >/dev/null
          echo "$RUNNER_TEMP/realizo-wrangler/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Create private isolated R2 bucket only when absent
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          if ! wrangler r2 bucket list --json | grep -q 'realizo-template-previews-sandbox'; then
            wrangler r2 bucket create realizo-template-previews-sandbox
          fi
          wrangler r2 bucket list --json | grep 'realizo-template-previews-sandbox'
      - name: Archive full-quality master privately; bucket MUST remain without public domain
        run: |
          set -euo pipefail
          wrangler r2 object put realizo-template-previews-sandbox/ugc-master-30s.mp4 \
            --file public/assets/realizo/templates/ugc-master-30s.mp4 \
            --content-type video/mp4 --remote
          echo 'Private Realizo template master stored; no public R2 access configured.'
