name: Realizo - live provider cost fix in Sandbox
on:
  push:
    branches: [fix/realizo-live-provider-costs]
    paths: ['.github/workflows/realizo-live-cost-sandbox.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: realizo-live-provider-costs-sandbox
  cancel-in-progress: false
jobs:
  validate-and-deploy:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/fix/realizo-live-provider-costs'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      REALIZO_ENV: sandbox
      REALIZO_AUTH_PROVIDER: native
      PAYPAL_MODE: sandbox
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify isolated Sandbox
        run: |
          node scripts/check-realizo-auth-sandbox.mjs
          npm run wallet:preflight:sandbox
      - name: Quote real costs and reject guessed amounts
        run: |
          node --test tests/realizo-real-cost-dynamic-quote.test.mjs \
            tests/realizo-template-independent-flow.test.mjs \
            tests/realizo-video-download-boundary.test.mjs
          npm run test:wallet
      - name: Build complete Realizo Sandbox
        run: |
          npm run cloudflare:build:realizo-auth-sandbox
          test -s .open-next/worker.js
      - name: Deploy only Realizo Sandbox - never production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/check-realizo-auth-sandbox.mjs
          npx --no-install opennextjs-cloudflare deploy --config wrangler.auth-sandbox.jsonc
      - name: Smoke-check protected wallet, without any paid Muapi generation
        run: |
          node --input-type=module <<'JS'
          const base='https://realizo-auth-sandbox.abelarriaga0.workers.dev';
          const s=await fetch(base+'/studio',{signal:AbortSignal.timeout(20000)});
          if(s.status!==200)throw Error('Studio unreachable: '+s.status);
          const w=await fetch(base+'/api/wallet',{signal:AbortSignal.timeout(20000)});
          if(w.status!==401)throw Error('Wallet exposed');
          console.log('PASS: only sandbox updated, wallet private, no Muapi generation costs.');
          JS
