name: Realizo AI Premium - validar beta sin proveedor ni despliegue
on:
  push:
    branches: [main]
    paths: ['.github/workflows/realizo-ai-premium-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'fec9e36f7eb55fdce60406a236eff9b0d60f968b'
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate database, code and prompt research schemas without spending
        run: |
          python3 -m unittest discover -s tests -p test_realizo_ai_premium_schema.py -v
          node --test tests/realizo-ai-premium.test.mjs
          node --input-type=module --check < lib/realizo-creative/ai-premium.js
          node --input-type=module --check < app/api/realizo/ai-premium/route.js
          node --input-type=module --check < app/api/realizo/ai-premium/'[id]'/route.js
          node --input-type=module --check < app/api/realizo/ai-premium/'[id]'/approve/route.js
      - name: Compile Premium UI and API for Cloudflare Sandbox only
        env:
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
          REALIZO_ENV: sandbox
          REALIZO_AUTH_PROVIDER: native
          REALIZO_WALLET_ONLY: 'true'
          PAYPAL_MODE: sandbox
          MUAPI_GENERATION_ENABLED: 'false'
          REALIZO_AUTH_ORIGIN: https://realizo-auth-sandbox.abelarriaga0.workers.dev
        run: npm run cloudflare:build:realizo-auth-sandbox
      - name: Confirm no billable providers used
        run: echo 'Only offline tests. No Cloudflare D1 mutation, OpenAI call, Muapi generation or PayPal transaction.'
