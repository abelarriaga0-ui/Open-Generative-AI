name: Realizo Sandbox - connect Cloudflare Access identity

on:
  push:
    branches:
      - feature/wallet-compartida-muapi
    paths:
      - .github/workflows/realizo-sandbox-access-identity.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: realizo-sandbox-access-identity
  cancel-in-progress: false

jobs:
  bind-access:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/wallet-compartida-muapi'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate isolated D1 and Sandbox Worker configuration
        run: npm run wallet:preflight:sandbox

      - name: Install standalone Wrangler (no code deployment)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/realizo-wrangler" --no-save --no-audit --no-fund wrangler@4.151.3
          echo "$RUNNER_TEMP/realizo-wrangler/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Write Access AUD and team hostname ONLY to realizo-sandbox
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCESS_AUD: ${{ secrets.CF_ACCESS_AUD }}
        run: |
          set -euo pipefail
          npm run wallet:preflight:sandbox
          node --input-type=module -e '
            const aud=process.env.CF_ACCESS_AUD;
            if (typeof aud !== "string" || !/^[a-zA-Z0-9_-]{20,256}$/.test(aud)) {
              console.error("Falta CF_ACCESS_AUD o su formato es inválido.");
              process.exit(1);
            }
            const domain="muddy-glitter-0708.cloudflareaccess.com";
            process.stdout.write(JSON.stringify({CF_ACCESS_AUD:aud,CF_ACCESS_TEAM_DOMAIN:domain}));
          ' | wrangler secret bulk --name realizo-sandbox --config wrangler.sandbox.jsonc
          echo 'Configuración Cloudflare Access guardada exclusivamente en realizo-sandbox.'

      - name: Verify Access integration secret names (never read values)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          wrangler secret list --name realizo-sandbox --config wrangler.sandbox.jsonc > "$RUNNER_TEMP/realizo-secret-names.json"
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const body=JSON.parse(readFileSync(process.env.RUNNER_TEMP+"/realizo-secret-names.json","utf8"));
            const names=new Set(body.map(s=>s.name));
            for (const name of ["CF_ACCESS_AUD","CF_ACCESS_TEAM_DOMAIN","PAYPAL_CLIENT_ID","PAYPAL_CLIENT_SECRET","PAYPAL_WEBHOOK_ID"]) {
              if (!names.has(name)) { console.error("Falta configuración requerida en el Worker: "+name); process.exit(1); }
            }
            console.log("OK: identidad y PayPal Sandbox configurados; valores secretos nunca leídos.");
          '
