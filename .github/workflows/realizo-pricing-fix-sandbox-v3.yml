name: Realizo - reliable Muapi pricing for every model (Sandbox)
on:
  push:
    branches: [fix/realizo-clear-errors-white-label-20261102]
    paths:
      - '.github/workflows/realizo-pricing-fix-sandbox-v3.yml'
      - 'lib/realizo-creative/wallet-generation.js'
      - 'components/RealizoTemplateCreator.jsx'
      - 'components/RealizoPremium.jsx'
      - 'app/api/wallet/generate/route.js'
      - 'app/api/wallet/quote/route.js'
      - 'tests/realizo-inline-charge-white-label.test.mjs'
      - 'tests/realizo-wallet-engine.test.mjs'
      - 'tests/realizo-sales-director.test.mjs'
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: realizo-unified-pricing-sandbox-v3
  cancel-in-progress: false
jobs:
  tests-and-publish:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/fix/realizo-clear-errors-white-label-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      REALIZO_ENV: sandbox
      REALIZO_AUTH_PROVIDER: native
      PAYPAL_MODE: sandbox
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify isolated Sandbox and no live payments
        run: |
          node scripts/check-realizo-auth-sandbox.mjs
          npm run wallet:preflight:sandbox
      - name: Run multi-model cost tests and wallet safety
        run: |
          node --test tests/realizo-pricing-route-health.test.mjs \
            tests/realizo-real-cost-dynamic-quote.test.mjs \
            tests/realizo-live-models.test.mjs \
            tests/realizo-template-independent-flow.test.mjs \
            tests/realizo-video-download-boundary.test.mjs \
            tests/realizo-inline-charge-white-label.test.mjs
          npm run test:wallet
      - name: Compile full Realizo Cloudflare Worker
        run: |
          npm run cloudflare:build:realizo-auth-sandbox
          test -s .open-next/worker.js
      - name: Deploy ONLY auth Sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/check-realizo-auth-sandbox.mjs
          npx --no-install opennextjs-cloudflare deploy --config wrangler.auth-sandbox.jsonc
      - name: Verify actual Cloudflare-to-Muapi pricing path, never paid generation
        run: |
          node --input-type=module <<'JS'
          const base='https://realizo-auth-sandbox.abelarriaga0.workers.dev';
          const site=await fetch(base+'/studio',{signal:AbortSignal.timeout(25000)});
          if(site.status!==200)throw Error('Sandbox website inaccessible: '+site.status);
          const wallet=await fetch(base+'/api/wallet',{signal:AbortSignal.timeout(25000)});
          if(wallet.status!==401)throw Error('Wallet access control regression: '+wallet.status);
          const live=await fetch(base+'/api/realizo/pricing/health',{cache:'no-store',signal:AbortSignal.timeout(50000)});
          const result=await live.json().catch(()=>({}));
          console.log('Cloudflare to Muapi quote health',JSON.stringify(result));
          if(live.status!==200 || result.ready!==true || result.live_model_quote!==true)
            throw Error('LIVE PROVIDER QUOTE FAILED FROM CLOUDFLARE EDGE: '+JSON.stringify(result));
          console.log('PASS: pricing works in real Sandbox edge, wallet protected, no paid generation requested.');
          JS
