name: Realizo - consolidate the existing studio safely
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/realizo-consolidated-release.yml"
      - "components/RealizoStudio.jsx"
      - "wrangler.consolidated.jsonc"
      - "app/api/wallet/quote/route.js"
      - "app/api/wallet/generate/route.js"
      - "app/api/wallet/paypal/create-order/route.js"
      - "lib/wallet/generation-policy.js"
      - "app/api/wallet/paypal/config/route.js"
      - "app/api/wallet/paypal/create-order/route.js"
      - "app/api/wallet/paypal/capture-order/route.js"
      - "app/api/wallet/paypal/webhook/route.js"
      - "components/wallet/PaypalTopup.jsx"
      - "migrations/0026_wallet_operator_adjustments.sql"
      - "lib/wallet/server.js"
      - "components/RealizoMotionHome.jsx"
      - "components/ConversionTemplatesStudio.jsx"
      - "app/realizo-motion-home.css"
      - "app/realizo-conversion-images.css"
      - "app/layout.js"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: realizo-existing-studio-consolidation
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify destination, preserve database, prohibit collection before Live verification
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.consolidated.jsonc','utf8'));
          if(cfg.name!=='realizo-auth-sandbox'||
            cfg.d1_databases?.[0]?.database_id!=='2561f6c8-bfb2-4ea4-8527-7fec29188edf'||
            cfg.vars.REALIZO_ENV!=='production'||
            cfg.vars.REALIZO_LIVE_PAYMENTS_ENABLED!=='true'||
            cfg.vars.MUAPI_GENERATION_ENABLED!=='true'||
            cfg.vars.REALIZO_MEDIA_D1_FALLBACK!=='true'||
            cfg.vars.REALIZO_TEMPLATE_IMAGES_ENABLED!=='true'||
            cfg.vars.REALIZO_AI_PREMIUM_ENABLED!=='true'||
            cfg.vars.REALIZO_AI_PREMIUM_PUBLIC_ENABLED!=='true')
              throw Error('Unexpected or unsafe canonical worker configuration');
          if(!process.env.CLOUDFLARE_API_TOKEN)throw Error('Cloudflare token missing');
          console.log('Verified public video, images, premium and Live checkout. Auto-topup remains consent-only and not implemented.');
          JS
      - name: Compile current Realizo application, including studio and all user workflows
        run: |
          npm pkg set 'devDependencies.@tailwindcss/vite=4.3.3'
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --no-save --package-lock=false next@16.4.2 @opennextjs/cloudflare@1.20.12 wrangler@4.156.2
          npm run build:packages
          npx opennextjs-cloudflare build --config wrangler.consolidated.jsonc
          test -s .open-next/worker.js
      - name: Verify existing account, reference media, and creative project records in-place
        run: |
          set -euo pipefail
          npx wrangler d1 execute WALLETS_DB --config wrangler.consolidated.jsonc --remote --command "SELECT CASE WHEN (SELECT COUNT(*) FROM realizo_accounts)>=1 AND (SELECT COUNT(*) FROM realizo_media_assets)>=37 AND (SELECT COUNT(*) FROM realizo_ai_projects)>=19 THEN 1 ELSE 0 END AS existing_data_preserved;" > /tmp/realizo-inventory.json
          node - <<'JS'
          const f=require('node:fs').readFileSync('/tmp/realizo-inventory.json','utf8');
          if(!/"existing_data_preserved"\s*:\s*1/.test(f))throw Error('Existing user content count mismatch; deployment aborted.');
          console.log('Existing identity, media and AI project record counts preserved.');
          JS
          npx wrangler d1 migrations apply WALLETS_DB --config wrangler.consolidated.jsonc --remote
          npx wrangler d1 execute WALLETS_DB --config wrangler.consolidated.jsonc --remote --command "SELECT CASE WHEN (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('paypal_live_first_topup_minimum','paypal_live_first_verified_deposit_minimum'))=2 THEN 1 ELSE 0 END AS live_first_payment_minimum_guard;" > /tmp/realizo-live-guard.json
          node - <<'JS'
          const s=require('node:fs').readFileSync('/tmp/realizo-live-guard.json','utf8');
          if(!/"live_first_payment_minimum_guard"\s*:\s*1/.test(s))throw Error('First Live deposit guard missing');
          console.log('Live USD 20 first payment SQL triggers verified.');
          JS
      - name: Deploy current studio to the SAME original URL and preserve existing Worker secrets
        run: npx opennextjs-cloudflare deploy --config wrangler.consolidated.jsonc
      - name: Verify public studio, login, content catalog, and blocked anonymous wallet
        run: |
          node --input-type=module <<'JS'
          const origin='https://realizo-auth-sandbox.abelarriaga0.workers.dev';
          const paths=[['/studio',200],['/studio/images',200],['/login',200],['/api/auth/features',200],['/api/conversion-templates',200],['/api/wallet',401],['/api/wallet/paypal/config',401]];
          for(const [p,status] of paths){
            const r=await fetch(origin+p,{redirect:'manual',signal:AbortSignal.timeout(20000)});
            if(r.status!==status)throw Error('Route '+p+' failed HTTP '+r.status+'; expected '+status);
            if(p==='/api/conversion-templates'){
              const j=await r.json();
              if(!Array.isArray(j.templates)||!j.templates.length||j.templates.some(t=>t.available&&(!Number.isInteger(t.price_cents)||t.price_cents<1)))
                throw Error('Catalog not ready or paid generation unexpectedly active');
            }
          }
          const webhook=await fetch(origin+'/api/wallet/paypal/webhook',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',redirect:'manual',signal:AbortSignal.timeout(20000)});
          if(webhook.status!==401)throw Error('Unsigned PayPal webhook must be denied, got '+webhook.status);
          console.log('Canonical public studio, generations and Live checkout deployed; login and unsigned webhook protected.');
          JS
