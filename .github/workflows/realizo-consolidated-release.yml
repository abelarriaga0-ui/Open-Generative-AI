name: Realizo - consolidate the existing studio safely
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/realizo-consolidated-release.yml"
      - "components/RealizoStudio.jsx"
      - "wrangler.consolidated.jsonc"
      - "app/api/wallet/quote/route.js"
      - "app/api/wallet/generate/route.js"
      - "app/api/wallet/paypal/create-order/route.js"
      - "lib/wallet/generation-policy.js"
      - "app/api/wallet/paypal/config/route.js"
      - "app/api/wallet/paypal/create-order/route.js"
      - "app/api/wallet/paypal/capture-order/route.js"
      - "app/api/wallet/paypal/webhook/route.js"
      - "app/api/internal/paypal-preflight/route.js"
      - "lib/wallet/request-policy.js"
      - "lib/wallet/live-video-models.js"
      - "lib/realizo-creative/wallet-generation.js"
      - "tests/realizo-live-models.test.mjs"
      - "tests/realizo-muapi-endpoint.test.mjs"
      - "tests/realizo-seedance-20-endpoint.test.mjs"
      - "components/wallet/PaypalTopup.jsx"
      - "migrations/0026_wallet_operator_adjustments.sql"
      - "lib/wallet/server.js"
      - "lib/realizo-creative/video-realism.js"
      - "lib/realizo-creative/sales-director.js"
      - "lib/realizo-creative/sales-storyboard.js"
      - "lib/realizo-creative/format-guides.js"
      - "lib/realizo-creative/ai-premium.js"
      - "lib/realizo-creative/hyperreal-commercial.js"
      - "lib/realizo-creative/creative-prompt-contracts.js"
      - "tests/realizo-product-identity-voice.test.mjs"
      - "tests/realizo-hyperreal-commercial.test.mjs"
      - "tests/realizo-ai-premium-live-wallet.test.mjs"
      - "tests/realizo-muapi-master-ugc30.test.mjs"
      - "lib/realizo-creative/research-lifecycle.js"
      - "app/api/realizo/ai-premium/route.js"
      - "app/api/realizo/ai-premium/[id]/route.js"
      - "tests/realizo-research-503-recovery.test.mjs"
      - "app/api/realizo/ai-premium/[id]/approve/route.js"
      - "components/RealizoPremium.jsx"
      - "tests/realizo-sales-director.test.mjs"
      - "lib/realizo-creative/ugc-master-30.js"
      - "tests/realizo-physical-realism.test.mjs"
      - "tests/realizo-luxury-template.test.mjs"
      - "lib/realizo-creative/luxury-product-only-template.js"
      - "lib/realizo-creative/ad-templates.js"
      - "components/RealizoTemplateLibrary.jsx"
      - "components/RealizoTemplateCreator.jsx"
      - "app/api/realizo/template/luxury/prepare/route.js"
      - "app/api/realizo/user-templates/route.js"
      - "app/api/realizo/user-templates/[id]/route.js"
      - "lib/realizo-creative/user-templates.js"
      - "migrations/0027_realizo_user_templates.sql"
      - "app/api/realizo/jobs/route.js"
      - "packages/studio/src/components/VideoStudio.jsx"
      - "tests/realizo-user-templates.test.mjs"
      - "components/RealizoMotionHome.jsx"
      - "components/ConversionTemplatesStudio.jsx"
      - "components/RealizoCreationsGallery.jsx"
      - "app/studio/**"
      - "tests/realizo-creations.test.mjs"
      - "app/realizo-motion-home.css"
      - "app/realizo-conversion-images.css"
      - "lib/realizo-images/**"
      - "app/api/realizo/images/**"
      - "migrations/0028_realizo_image_creative_studio.sql"
      - "tests/realizo-images.test.mjs"
      - "tests/realizo-image-recovery.test.mjs"
      - "app/api/wallet/jobs/[id]/route.js"
      - "app/api/wallet/route.js"
      - "app/api/realizo/jobs/route.js"
      - "app/layout.js"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: realizo-existing-studio-consolidation
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify destination, preserve database, prohibit collection before Live verification
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const cfg=JSON.parse(fs.readFileSync('wrangler.consolidated.jsonc','utf8'));
          if(cfg.name!=='realizo-auth-sandbox'||
            cfg.d1_databases?.[0]?.database_id!=='2561f6c8-bfb2-4ea4-8527-7fec29188edf'||
            cfg.vars.REALIZO_ENV!=='production'||
            cfg.vars.REALIZO_LIVE_PAYMENTS_ENABLED!=='true'||
            cfg.vars.MUAPI_GENERATION_ENABLED!=='true'||
            cfg.vars.REALIZO_MEDIA_D1_FALLBACK!=='true'||
            cfg.vars.REALIZO_TEMPLATE_IMAGES_ENABLED!=='true'||
            cfg.vars.REALIZO_AI_PREMIUM_ENABLED!=='true'||
            cfg.vars.REALIZO_AI_PREMIUM_PUBLIC_ENABLED!=='true')
              throw Error('Unexpected or unsafe canonical worker configuration');
          if(!process.env.CLOUDFLARE_API_TOKEN)throw Error('Cloudflare token missing');
          console.log('Verified public video, images, premium and Live checkout. Auto-topup remains consent-only and not implemented.');
          JS
      - name: Verify realistic video appearance across all director styles before deployment
        run: node --test tests/realizo-physical-realism.test.mjs tests/realizo-luxury-template.test.mjs tests/realizo-seedance-20-endpoint.test.mjs tests/realizo-live-models.test.mjs tests/realizo-muapi-endpoint.test.mjs tests/realizo-user-templates.test.mjs tests/realizo-sales-director.test.mjs
      - name: Check product identity and spoken-script integrity
        run: node --test tests/realizo-product-identity-voice.test.mjs
      - name: Verify hyperreal commercial storyboards across all styles before shipping
        run: node --test tests/realizo-hyperreal-commercial.test.mjs tests/realizo-muapi-master-ugc30.test.mjs tests/realizo-sales-director.test.mjs tests/realizo-premium-film-contract.test.mjs
      - name: Verify visible wallet and research spendable balance agree before publishing
        run: |
          node --test tests/realizo-ai-premium-live-wallet.test.mjs tests/realizo-ai-premium.test.mjs
          python -m unittest discover -s tests -p test_realizo_sandbox_owner_shared_wallet.py -v
      - name: Verify AI Premium 503 recovery, idempotent paid research and full refund
        run: node --test tests/realizo-research-503-recovery.test.mjs tests/realizo-ai-premium.test.mjs tests/realizo-premium-recovery.test.mjs
      - name: Verify Image Studio creative rules, contracts and user privacy
        run: node --test tests/realizo-images.test.mjs tests/realizo-image-recovery.test.mjs tests/realizo-creations.test.mjs
      - name: Compile current Realizo application, including studio and all user workflows
        run: |
          npm pkg set 'devDependencies.@tailwindcss/vite=4.3.3'
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --no-save --package-lock=false next@16.4.2 @opennextjs/cloudflare@1.20.12 wrangler@4.156.2
          npm run build:packages
          npx opennextjs-cloudflare build --config wrangler.consolidated.jsonc
          test -s .open-next/worker.js
      - name: Verify existing account, reference media, and creative project records in-place
        run: |
          set -euo pipefail
          npx wrangler d1 execute WALLETS_DB --config wrangler.consolidated.jsonc --remote --command "SELECT CASE WHEN (SELECT COUNT(*) FROM realizo_accounts)>=1 AND (SELECT COUNT(*) FROM realizo_media_assets)>=37 AND (SELECT COUNT(*) FROM realizo_ai_projects)>=19 THEN 1 ELSE 0 END AS existing_data_preserved;" > /tmp/realizo-inventory.json
          node - <<'JS'
          const f=require('node:fs').readFileSync('/tmp/realizo-inventory.json','utf8');
          if(!/"existing_data_preserved"\s*:\s*1/.test(f))throw Error('Existing user content count mismatch; deployment aborted.');
          console.log('Existing identity, media and AI project record counts preserved.');
          JS
          npx wrangler d1 migrations apply WALLETS_DB --config wrangler.consolidated.jsonc --remote
          npx wrangler d1 execute WALLETS_DB --config wrangler.consolidated.jsonc --remote --command "SELECT CASE WHEN (SELECT COUNT(*) FROM sqlite_master WHERE name='realizo_user_templates' AND type='table')=1 AND (SELECT COUNT(*) FROM pragma_table_info('generation_jobs') WHERE name='template_source_json')=1 THEN 1 ELSE 0 END AS private_template_schema_ready;" > /tmp/realizo-templates-schema.json
          node - <<'JS'
          const result=require('node:fs').readFileSync('/tmp/realizo-templates-schema.json','utf8');
          if(!/"private_template_schema_ready"\s*:\s*1/.test(result))throw Error('Private templates storage not migrated.');
          console.log('Private per-user templates schema verified; wallets untouched.');
          JS
          npx wrangler d1 execute WALLETS_DB --config wrangler.consolidated.jsonc --remote --command "SELECT CASE WHEN (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name IN ('realizo_image_uploads','realizo_image_presets','realizo_image_creations'))=3 THEN 1 ELSE 0 END AS image_studio_schema_ready;" > /tmp/realizo-images-schema.json
          node - <<'JS'
          const x=require('node:fs').readFileSync('/tmp/realizo-images-schema.json','utf8');
          if(!/"image_studio_schema_ready"\s*:\s*1/.test(x))throw Error('Image Studio migration not ready');
          console.log('Image Studio D1 schema ready; wallets untouched.');

          JS
          npx wrangler d1 execute WALLETS_DB --config wrangler.consolidated.jsonc --remote --command "SELECT CASE WHEN (SELECT COUNT(*) FROM sqlite_master WHERE type='trigger' AND name IN ('paypal_live_first_topup_minimum','paypal_live_first_verified_deposit_minimum'))=2 THEN 1 ELSE 0 END AS live_first_payment_minimum_guard;" > /tmp/realizo-live-guard.json
          node - <<'JS'
          const s=require('node:fs').readFileSync('/tmp/realizo-live-guard.json','utf8');
          if(!/"live_first_payment_minimum_guard"\s*:\s*1/.test(s))throw Error('First Live deposit guard missing');
          console.log('Live USD 20 first payment SQL triggers verified.');
          JS
      - name: Deploy current studio to the SAME original URL and preserve existing Worker secrets
        run: npx opennextjs-cloudflare deploy --config wrangler.consolidated.jsonc
      - name: Verify public studio, login, content catalog, and blocked anonymous wallet
        run: |
          node --input-type=module <<'JS'
          const origin='https://realizo-auth-sandbox.abelarriaga0.workers.dev';
          const paths=[['/studio',200],['/studio/images',200],['/studio/creations',200],['/login',200],['/api/auth/features',200],['/api/conversion-templates',200],['/api/realizo/images/config',200],['/api/realizo/images/presets',401],['/api/realizo/images/history',401],['/api/wallet',401],['/api/wallet/paypal/config',401],['/api/realizo/template/luxury/prepare',405],['/api/realizo/user-templates',401]];
          for(const [p,status] of paths){
            const r=await fetch(origin+p,{redirect:'manual',signal:AbortSignal.timeout(20000)});
            const location=r.headers.get('location')||'';
            const destination=location?new URL(location,origin):null;
            const authRedirect=p==='/studio/creations'&&r.status===307&&
              destination?.origin===origin&&(
                destination.pathname.startsWith('/login')||
                destination.pathname.startsWith('/studio')||
                destination.pathname.startsWith('/api/auth'));
            if(r.status!==status&&!authRedirect)
              throw Error('Route '+p+' failed HTTP '+r.status+'; expected '+status);
            if(p==='/api/realizo/images/config'){
              const config=await r.json();
              if(!config.available || config.image_price_cents!==14 || config.research_price_cents!==0)
                throw Error('Single-model image generation is not active or pricing is wrong');
            }
            if(p==='/api/conversion-templates'){
              const j=await r.json();
              if(!Array.isArray(j.templates)||!j.templates.length||j.templates.some(t=>t.available&&(!Number.isInteger(t.price_cents)||t.price_cents<1)))
                throw Error('Catalog not ready or paid generation unexpectedly active');
            }
          }
          const luxury=await fetch(origin+'/api/realizo/template/luxury/prepare',{method:'POST',
            headers:{'Content-Type':'application/json','Origin':origin},body:'{}',redirect:'manual',
            signal:AbortSignal.timeout(20000)});
          if(luxury.status!==401)throw Error('Unauthenticated luxury prepare must return 401, got '+luxury.status);
          const privatePost=await fetch(origin+'/api/realizo/user-templates',{
            method:'POST',headers:{'Origin':origin,'Content-Type':'application/json'},
            body:JSON.stringify({prompt:'Example private template prompt',model_id:'veo3.1-reference-to-video'}),
            redirect:'manual',signal:AbortSignal.timeout(20000)
          });
          if(privatePost.status!==401)throw Error('Unauthenticated template write must return 401; got '+privatePost.status);
          const webhook=await fetch(origin+'/api/wallet/paypal/webhook',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}',redirect:'manual',signal:AbortSignal.timeout(20000)});
          if(webhook.status!==401)throw Error('Unsigned PayPal webhook must be denied, got '+webhook.status);
          console.log('Canonical public studio, generations and Live checkout deployed; login and unsigned webhook protected.');
          JS
      - name: Verify actual PayPal Live OAuth and signed-webhook configuration without charging anyone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: |
          node --input-type=module <<'JS'
          import { randomBytes } from 'node:crypto';
          const api='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/realizo-auth-sandbox/secrets';
          const auth={'Authorization':'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const oneTimeToken=randomBytes(48).toString('hex');
          const name='REALIZO_OPERATOR_PREFLIGHT_TOKEN';
          const put=await fetch(api,{method:'PUT',headers:{...auth,'Content-Type':'application/json'},
            body:JSON.stringify({name,type:'secret_text',text:oneTimeToken}),signal:AbortSignal.timeout(20000)});
          if(!put.ok)throw Error('Cloudflare temporary merchant check secret setup failed HTTP '+put.status);
          let verdict=null;
          try{
            for(let attempt=0;attempt<5;attempt++){
              const r=await fetch('https://realizo-auth-sandbox.abelarriaga0.workers.dev/api/internal/paypal-preflight',{
                headers:{'x-realizo-operator-token':oneTimeToken},signal:AbortSignal.timeout(30000),cache:'no-store'});
              const data=await r.json().catch(()=>({}));
              if(r.status===404){await new Promise(resolve=>setTimeout(resolve,1500));continue;}
              verdict={status:r.status,ready:data.ready===true,reason:data.reason||null,paypal_status:data.paypal_status||null,checks:data.checks||null};
              break;
            }
            if(!verdict)throw Error('PayPal merchant route unavailable after deployment');
            console.log('LIVE_PAYPAL_READINESS='+JSON.stringify(verdict));
            if(!verdict.ready)process.exitCode=1;
          }finally{
            const remove=await fetch(api+'/'+name,{method:'DELETE',headers:auth,signal:AbortSignal.timeout(20000)});
            console.log('MERCHANT_CHECK_TEMPORARY_SECRET_REMOVAL_HTTP='+remove.status);
            if(!remove.ok)process.exitCode=1;
          }
          JS
