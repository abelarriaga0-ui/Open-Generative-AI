name: Temporary Realizo compile check - isolated syntax fix
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/api/realizo/ai-premium/[id]/approve/route.js'
      - '.github/workflows/temp-realizo-compile-check-20261107.yml'
permissions:
  contents: read
jobs:
  compile_without_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validate the exact unchanged approval module
        run: node --check 'app/api/realizo/ai-premium/[id]/approve/route.js'
      - name: Check existing video generation logic (no provider calls)
        run: |
          node --test tests/realizo-live-premium-catalog-kling4.test.mjs tests/realizo-premium-film-contract.test.mjs tests/realizo-direct-premium-generation.test.mjs
      - name: Compile Next.js and studio without deploying or changing services
        run: |
          npm pkg set 'devDependencies.@tailwindcss/vite=4.3.3'
          npm install --no-audit --no-fund --legacy-peer-deps
          npm install --no-save --package-lock=false next@16.4.2 @opennextjs/cloudflare@1.20.12 wrangler@4.156.2
          npm run build:packages
          npx opennextjs-cloudflare build --config wrangler.consolidated.jsonc
          test -s .open-next/worker.js
