name: Realizo - diagnostico imagenes publicado
on:
  push:
    branches: [main]
    paths: [".github/workflows/realizo-images-diagnostic.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 7e405c54c1a91abbdad537f7fec379a1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consultar catálogo público sin gastar
        run: |
          node --input-type=module <<'JS'
          const base='https://realizo.abelarriaga0.workers.dev';
          for (const path of ['/api/conversion-templates','/api/auth/features','/studio/images']) {
            const r=await fetch(base+path,{redirect:'manual',signal:AbortSignal.timeout(15000)});
            const body=path.startsWith('/api/')?await r.text():'';
            console.log('ENDPOINT',path,'HTTP',r.status,'BODY',body.slice(0,1300));
          }
          JS
      - name: Consultar configuración D1 sin datos de clientes
        run: |
          npx --yes wrangler@4.156.2 d1 execute WALLETS_DB --config wrangler.production.jsonc --remote --command "SELECT model_id,muapi_endpoint,enabled,customer_price_cents,allowed_input_keys_json,fixed_options_json FROM model_prices WHERE model_id LIKE 'realizo_%';"
