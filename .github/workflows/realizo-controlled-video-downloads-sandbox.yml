name: Realizo - restrict media save and publish Sandbox
on:
  push:
    branches: [feature/realizo-controlled-video-downloads]
    paths:
      - '.github/workflows/realizo-controlled-video-downloads-sandbox.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: realizo-video-controls-sandbox
  cancel-in-progress: false
jobs:
  verify-and-publish:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/realizo-controlled-video-downloads'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      REALIZO_ENV: sandbox
      REALIZO_AUTH_PROVIDER: native
      PAYPAL_MODE: sandbox
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Confirm isolated Sandbox and protected template asset
        run: |
          node scripts/check-realizo-auth-sandbox.mjs
          npm run wallet:preflight:sandbox
          test -s public/assets/realizo/templates/ugc-preview-30s.mp4
          test ! -e public/assets/realizo/templates/ugc-master-30s.mp4
      - name: Check all media download control boundaries
        run: |
          node --test tests/realizo-video-download-boundary.test.mjs \
            tests/realizo-template-independent-flow.test.mjs \
            tests/realizo-muapi-master-ugc30.test.mjs
      - name: Compile full Realizo app for existing Sandbox
        run: npm run cloudflare:build:realizo-auth-sandbox
      - name: Test existing wallet and UI before deployment
        run: |
          npm run test:wallet
          node --test tests/realizo-ad-templates-v11.test.mjs \
            tests/realizo-premium-studio.test.mjs
          test -s .open-next/worker.js
      - name: Deploy exclusively realizo-auth-sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/check-realizo-auth-sandbox.mjs
          npx --no-install opennextjs-cloudflare deploy --config wrangler.auth-sandbox.jsonc
      - name: Verify branded preview and private wallet; never call paid Muapi
        run: |
          node --input-type=module <<'JS'
          const base='https://realizo-auth-sandbox.abelarriaga0.workers.dev';
          const preview=await fetch(base+'/assets/realizo/templates/ugc-preview-30s.mp4',
           {method:'HEAD',signal:AbortSignal.timeout(20000)});
          if(preview.status!==200||!/video\/mp4/.test(preview.headers.get('content-type')||''))
            throw Error('Preview media not served: '+preview.status);
          const wallet=await fetch(base+'/api/wallet',{signal:AbortSignal.timeout(20000)});
          if(wallet.status!==401)throw Error('Wallet not protected');
          console.log('PASS: branded preview available; wallet secure; no AI charges.');
          JS

