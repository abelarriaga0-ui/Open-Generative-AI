name: Realizo - premium motion design Sandbox
on:
  push:
    branches: [feature/realizo-premium-motion-interface]
    paths: ['.github/workflows/realizo-premium-motion-sandbox.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: realizo-premium-motion-sandbox
  cancel-in-progress: false
jobs:
  design-test-and-publish:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/realizo-premium-motion-interface'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      REALIZO_ENV: sandbox
      REALIZO_AUTH_PROVIDER: native
      PAYPAL_MODE: sandbox
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Confirm isolated environment and real video assets
        run: |
          node scripts/check-realizo-auth-sandbox.mjs
          npm run wallet:preflight:sandbox
          test -s public/assets/realizo/templates/ugc-hover-5s.mp4
          test -s public/assets/realizo/templates/ugc-preview-stream-30s.mp4
          test ! -e public/assets/realizo/templates/ugc-master-30s.mp4
      - name: Verify UI behavior, protected preview and billing contracts
        run: |
          node --test tests/realizo-premium-motion-interface.test.mjs \
            tests/realizo-template-independent-flow.test.mjs \
            tests/realizo-video-download-boundary.test.mjs \
            tests/realizo-muapi-master-ugc30.test.mjs
      - name: Compile full isolated Cloudflare app
        run: npm run cloudflare:build:realizo-auth-sandbox
      - name: Wallet and video creation regression tests
        run: |
          npm run test:wallet
          node --test tests/realizo-ad-templates-v11.test.mjs \
            tests/realizo-premium-studio.test.mjs
          test -s .open-next/worker.js
      - name: Deploy ONLY realizo-auth-sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          node scripts/check-realizo-auth-sandbox.mjs
          npx --no-install opennextjs-cloudflare deploy --config wrangler.auth-sandbox.jsonc
      - name: Smoke check studio and original UGC previews without paid Muapi requests
        run: |
          node --input-type=module <<'JS'
          const base='https://realizo-auth-sandbox.abelarriaga0.workers.dev';
          const studio=await fetch(base+'/studio',{signal:AbortSignal.timeout(20000)});
          if(studio.status!==200)throw Error('Studio not available: '+studio.status);
          const movie=await fetch(base+'/assets/realizo/templates/ugc-hover-5s.mp4',{method:'HEAD',signal:AbortSignal.timeout(20000)});
          if(movie.status!==200||!/video\/mp4/.test(movie.headers.get('content-type')||''))throw Error('Motion preview missing');
          const wallet=await fetch(base+'/api/wallet',{signal:AbortSignal.timeout(20000)});
          if(wallet.status!==401)throw Error('Private wallet exposed');
          console.log('PASS: premium motion sandbox public, secure wallet, no AI costs.');
          JS

