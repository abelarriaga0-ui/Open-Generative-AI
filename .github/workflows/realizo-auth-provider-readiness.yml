name: Realizo Sandbox - login provider readiness (no deployment)
on:
  push:
    branches: [feature/realizo-cloudflare-auth-videos]
    paths: ['.github/workflows/realizo-auth-provider-readiness.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/realizo-cloudflare-auth-videos'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify configured provider secrets by presence only and check hosted login
        env:
          GOOGLE_ID: ${{ secrets.REALIZO_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_SECRET: ${{ secrets.REALIZO_GOOGLE_OAUTH_CLIENT_SECRET }}
          RESEND_KEY: ${{ secrets.REALIZO_RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.REALIZO_EMAIL_FROM }}
        run: |
          node --input-type=module <<'JS'
          const google = !!process.env.GOOGLE_ID && !!process.env.GOOGLE_SECRET;
          const email = !!process.env.RESEND_KEY && !!process.env.EMAIL_FROM;
          const partialGoogle = (!!process.env.GOOGLE_ID) !== (!!process.env.GOOGLE_SECRET);
          const partialEmail = (!!process.env.RESEND_KEY) !== (!!process.env.EMAIL_FROM);
          const r = await fetch('https://realizo-auth-sandbox.abelarriaga0.workers.dev/api/auth/features',{signal:AbortSignal.timeout(15000)});
          if (!r.ok) throw new Error('Login configuration endpoint is unreachable');
          const flags = await r.json();
          console.log('GITHUB_GOOGLE_OAUTH_PAIR_PRESENT=' + google);
          console.log('GITHUB_EMAIL_SENDER_PAIR_PRESENT=' + email);
          console.log('GITHUB_GOOGLE_PAIR_INCOMPLETE=' + partialGoogle);
          console.log('GITHUB_EMAIL_PAIR_INCOMPLETE=' + partialEmail);
          console.log('WORKER_NATIVE_LOGIN_ENABLED=' + Boolean(flags.enabled));
          console.log('WORKER_GOOGLE_LOGIN_READY=' + Boolean(flags.google));
          console.log('WORKER_EMAIL_LOGIN_READY=' + Boolean(flags.email));
          if (google && !flags.google) throw new Error('Google credentials present in GitHub but not active on Worker');
          const base='https://realizo-auth-sandbox.abelarriaga0.workers.dev';
          const result=await fetch(base+'/api/auth/google/start',{redirect:'manual',signal:AbortSignal.timeout(15000)});
          const location=result.headers.get('location');
          let redirectHost='none';
          try {redirectHost=location ? new URL(location,base).hostname : 'none';} catch {}
          console.log('GOOGLE_START_STATUS='+result.status);
          console.log('GOOGLE_REDIRECT_HOST='+redirectHost);
          if (!flags.google || result.status!==302 || redirectHost!=='accounts.google.com')
            throw new Error('Google OAuth start is not redirecting to Google');
          const wallet=await fetch(base+'/api/wallet',{redirect:'manual',signal:AbortSignal.timeout(15000)});
          console.log('ANONYMOUS_WALLET_STATUS='+wallet.status);
          if(wallet.status!==401) throw new Error('Anonymous wallet request must remain blocked');
          console.log('PASS: Google OAuth start redirect and anonymous wallet protection validated.');
          console.log('NOTE: A complete Google login still requires a human test account.');

          JS
