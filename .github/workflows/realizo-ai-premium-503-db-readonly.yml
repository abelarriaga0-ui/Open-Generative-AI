name: Realizo - AI Premium 503 D1 booking audit (no writes)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/realizo-ai-premium-503-db-readonly.yml"
permissions:
  contents: read
jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Query aggregate recent Premium research states without personal information or charges
        run: |
          node --input-type=module <<'JS'
          const base='https://api.cloudflare.com/client/v4/accounts/7e405c54c1a91abbdad537f7fec379a1/d1/database/2561f6c8-bfb2-4ea4-8527-7fec29188edf/query';
          async function query(sql){
            const response=await fetch(base,{method:'POST',headers:{
              Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,
              'Content-Type':'application/json'
            },body:JSON.stringify({sql}),signal:AbortSignal.timeout(20000)});
            const json=await response.json();
            if(!response.ok||!json.success)throw Error('D1 read-only status unavailable '+response.status);
            return json.result?.[0]?.results||[];
          }
          const totals=await query("SELECT status,coalesce(error_code,'none') AS error,COUNT(*) AS count FROM realizo_ai_projects WHERE created_at>=datetime('now','-4 hours') GROUP BY status,error_code ORDER BY count DESC LIMIT 15");
          console.log('RESEARCH_STATES_4H',JSON.stringify(totals));
          const timestamps=await query("SELECT strftime('%Y-%m-%d %H:%M',created_at) AS minute,status,coalesce(error_code,'none') AS error,COUNT(*) AS count FROM realizo_ai_projects WHERE created_at>=datetime('now','-1 hour') GROUP BY minute,status,error_code ORDER BY minute DESC LIMIT 20");
          console.log('RESEARCH_MINUTE_STATES_1H',JSON.stringify(timestamps));
          const orders=await query("SELECT status,COUNT(*) AS count FROM realizo_ai_premium_orders WHERE created_at>=datetime('now','-4 hours') GROUP BY status");
          console.log('RESEARCH_PAYMENT_RESERVATIONS_4H',JSON.stringify(orders));
          JS