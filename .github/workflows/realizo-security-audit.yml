name: Realizo security audit (no deploy)
on:
  push:
    branches: ['security/realizo-hardening-2026-11-25']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/realizo-security-hardening.test.mjs
  git-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched Git refs with redaction
        run: |
          out="$(mktemp -d)"
          trap 'rm -rf "$out"' EXIT
          set +e
          docker run --rm -v "$PWD:/repo:ro" -v "$out:/out" zricethezav/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055 git /repo --log-opts="--all" --redact=100 --no-banner --log-level error --report-format json --report-path /out/findings.json --exit-code 23
          code=$?
          set -e
          if [ "$code" -eq 23 ]; then
            python3 -c 'import json,sys; a=json.load(open(sys.argv[1])); print("Potential secret findings:",len(a)); [print(json.dumps({k:x.get(k) for k in ("RuleID","File","StartLine","Commit")},ensure_ascii=True)) for x in a[:100]]' "$out/findings.json"
            exit 23
          fi
          exit "$code"
