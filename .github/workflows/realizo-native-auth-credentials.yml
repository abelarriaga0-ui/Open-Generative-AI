name: Realizo Sandbox - install native Google and email login secrets
on:
  push:
    branches: [feature/realizo-cloudflare-auth-videos]
    paths: ['.github/workflows/realizo-native-auth-credentials.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    if: github.repository == 'abelarriaga0-ui/Open-Generative-AI' && github.ref == 'refs/heads/feature/realizo-cloudflare-auth-videos'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated Sandbox configuration
        run: node scripts/check-realizo-auth-sandbox.mjs
      - name: Prepare Wrangler without deployments
        run: npm install --prefix "$RUNNER_TEMP/wrangler" --no-save --no-audit --no-fund wrangler@4.151.3
      - name: Install only complete provider credentials into native-auth Sandbox
        env:
          CLOUDFLARE_ACCOUNT_ID: '7e405c54c1a91abbdad537f7fec379a1'
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.REALIZO_GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.REALIZO_GOOGLE_OAUTH_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.REALIZO_RESEND_API_KEY }}
          REALIZO_EMAIL_FROM: ${{ secrets.REALIZO_EMAIL_FROM }}
        shell: bash
        run: |
          set -euo pipefail
          NODE_SCRIPT='const g=!!process.env.GOOGLE_OAUTH_CLIENT_ID,h=!!process.env.GOOGLE_OAUTH_CLIENT_SECRET,e=!!process.env.RESEND_API_KEY,f=!!process.env.REALIZO_EMAIL_FROM;
          if(g!==h||e!==f||(!g&&!e)){console.error("Faltan credenciales completas para al menos un proveedor");process.exit(1);}
          if(g&&!/^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$/.test(process.env.GOOGLE_OAUTH_CLIENT_ID))process.exit(1);
          if(e&&!/^[^\s<>]+@[^\s<>]+\.[^\s<>]+$/.test(process.env.REALIZO_EMAIL_FROM))process.exit(1);
          const obj={};
          if(g){obj.GOOGLE_OAUTH_CLIENT_ID=process.env.GOOGLE_OAUTH_CLIENT_ID;obj.GOOGLE_OAUTH_CLIENT_SECRET=process.env.GOOGLE_OAUTH_CLIENT_SECRET;}
          if(e){obj.RESEND_API_KEY=process.env.RESEND_API_KEY;obj.REALIZO_EMAIL_FROM=process.env.REALIZO_EMAIL_FROM;}
          process.stdout.write(JSON.stringify(obj));'
          node -e "$NODE_SCRIPT" |
            "$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" secret bulk --name realizo-auth-sandbox --config wrangler.auth-sandbox.jsonc
          echo 'Provider credentials stored securely on isolated Realizo Sandbox Worker.'
      - name: Verify provider availability without exposing secrets
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const r=await fetch('https://realizo-auth-sandbox.abelarriaga0.workers.dev/api/auth/features');
          if(!r.ok)throw Error('Auth feature check unavailable');
          const f=await r.json();
          if(!f.enabled||(!f.google&&!f.email))throw Error('No native login provider enabled');
          console.log('Realizo native login: Google configured='+f.google+', email configured='+f.email);
          const wallet=await fetch('https://realizo-auth-sandbox.abelarriaga0.workers.dev/api/wallet',{redirect:'manual'});
          if(wallet.status!==401)throw Error('Wallet must remain protected from anonymous requests');
          JS
