name: Wallet schema checks
on:
  pull_request:
    paths:
      - "migrations/0001_wallet.sql"
      - "migrations/0002_paypal.sql"
      - "tests/test_wallet_schema.py"
      - ".github/workflows/wallet-schema.yml"
  push:
    branches:
      - "feature/wallet-compartida-muapi"
    paths:
      - "migrations/0001_wallet.sql"
      - "migrations/0002_paypal.sql"
      - "tests/test_wallet_schema.py"
      - ".github/workflows/wallet-schema.yml"
jobs:
  sqlite-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p "test_wallet_schema.py" -v
      - name: Comprobar sintaxis JavaScript de billetera y PayPal
        run: |
          node --check lib/wallet/paypal.js
          node --check lib/wallet/server.js
          node --check lib/wallet/access-auth.js
          node --check app/api/wallet/route.js
          node --check app/api/wallet/generate/route.js
          node --check app/api/wallet/jobs/'[id]'/route.js
          node --check app/api/wallet/paypal/config/route.js
          node --check app/api/wallet/paypal/create-order/route.js
          node --check app/api/wallet/paypal/capture-order/route.js
          node --check app/api/wallet/paypal/webhook/route.js
